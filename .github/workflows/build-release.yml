name: Build & Release (Windows / Android)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes'
        required: false
        default: 'KitePaper release'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    # 构建脚本是 bash，Windows runner 默认 shell 为 PowerShell，必须显式指定。
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Build Windows
        run: ./scripts/build-windows.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitepaper-windows
          path: build/windows/kitepaper.zip
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Build Android APK + AAB
        run: ./scripts/build-android.sh

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitepaper-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitepaper-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  publish-release:
    name: Publish Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: kitepaper-windows
          path: dist/windows

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kitepaper-android-apk
          path: dist/android

      - name: Download Android AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: kitepaper-android-aab
          path: dist/android-aab

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "${{ github.event.inputs.tag || '' }}" "${{ github.event.inputs.release_notes || '' }}"
